# NicGit on one machine (on premises, or the baseline of the hosted service).
#   cp deploy/nicgit.env.example deploy/nicgit.env   # then edit the secrets
#   docker compose -f deploy/compose.yaml --env-file deploy/nicgit.env up -d --build
name: nicgit
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nicgit
      POSTGRES_PASSWORD: ${NICGIT_DB_PASSWORD:?set NICGIT_DB_PASSWORD}
      POSTGRES_DB: nicgit
    volumes: [db:/var/lib/postgresql/data]
    networks: [db]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nicgit"], interval: 5s, retries: 30 }
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      additional_contexts: { kimcad: ../../kimcad }
    environment:
      NICGIT_DATABASE_URL: postgres://nicgit:${NICGIT_DB_PASSWORD}@db:5432/nicgit
      NICGIT_WORKER_TOKEN: ${NICGIT_WORKER_TOKEN:?set NICGIT_WORKER_TOKEN}
      NICGIT_PUBLIC_URL: ${NICGIT_PUBLIC_URL:-http://localhost:3000}
      NICGIT_GOOGLE_CLIENT_ID: ${NICGIT_GOOGLE_CLIENT_ID:-}
      NICGIT_GOOGLE_CLIENT_SECRET: ${NICGIT_GOOGLE_CLIENT_SECRET:-}
      NICGIT_SITE_ADMIN_EMAIL: ${NICGIT_SITE_ADMIN_EMAIL:-}
      NICGIT_AI_ROUTER_URL: ${NICGIT_AI_ROUTER_URL:-}
      NICGIT_AI_ROUTER_KEY: ${NICGIT_AI_ROUTER_KEY:-}
      NICGIT_MAX_FILE_MB: ${NICGIT_MAX_FILE_MB:-512}
      NICGIT_MAX_REPO_MB: ${NICGIT_MAX_REPO_MB:-2048}
      NICGIT_MAX_ACCOUNT_MB: ${NICGIT_MAX_ACCOUNT_MB:-5120}
      NICGIT_MAX_PROJECTS: ${NICGIT_MAX_PROJECTS:-100}
      NICGIT_MAX_ORGS: ${NICGIT_MAX_ORGS:-3}
      # The workers' API. Only port 3000 is published: this one is reachable from the workers' network alone.
      NICGIT_INTERNAL_BIND: 0.0.0.0:3001
    volumes: [data:/var/lib/nicgit/data]
    ports: ["${NICGIT_PORT:-3000}:3000"]
    networks: [db, workers, public]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  # Engine workers parse untrusted IFC/.kim files, so they get as little as possible (decision N30): no shared
  # data, no database, no internet, no privileges, bounded memory. They reach only the server, and each job
  # only its own project through it. Size them for the models you host: a 100k-element model needs several GB.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      additional_contexts: { kimcad: ../../kimcad }
    environment:
      NICGIT_URL: http://server:3001
      NICGIT_WORKER_TOKEN: ${NICGIT_WORKER_TOKEN}
      NICGIT_JOB_TIMEOUT_MINUTES: ${NICGIT_JOB_TIMEOUT_MINUTES:-60}
      # Everything else in this container belongs to a job, and goes when the job ends.
      NICGIT_WORKER_CONTAINED: "1"
      TMPDIR: /work
    # Each job's temporary copy. Removed after every job; the rest of the filesystem is read-only.
    volumes: [/work]
    read_only: true
    networks: [workers]
    deploy:
      replicas: ${NICGIT_WORKERS:-2}
      resources: { limits: { memory: "${NICGIT_WORKER_MEMORY:-4g}", cpus: "1.0" } }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [server]
    restart: unless-stopped

networks:
  db: { internal: true }
  workers: { internal: true }
  public: {}

volumes:
  db: {}
  data: {}
