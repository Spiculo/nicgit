[workspace]
resolver = "3"
members = ["crates/nicgit-core", "crates/nicgit-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Hashing in tests would be very slow unoptimised.
[profile.dev.package.sha2]
opt-level = 3
